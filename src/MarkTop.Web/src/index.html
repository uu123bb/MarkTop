<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https://doc.local data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://doc.local" />
  <title>MarkTop</title>
  <link rel="stylesheet" href="vendor/vditor/dist/index.css" />
  <link rel="stylesheet" href="vendor/vditor/dist/js/katex/katex.min.css" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="print.css" media="print" />
  <script src="vendor/vditor/dist/index.min.js"></script>
  <script src="vendor/vditor/dist/js/katex/katex.min.js"></script>
</head>
<body>
  <div id="workspace" class="mode-split kind-markdown">
    <section id="source-pane" aria-label="源码">
      <div id="cm-host"></div>
    </section>
    <div id="splitter" role="separator" aria-orientation="vertical"></div>
    <section id="preview-pane" aria-label="预览">
      <div id="preview" class="vditor-reset"></div>
    </section>
    <section id="ir-pane" aria-label="所见即所得">
      <div id="ir-host"></div>
    </section>
  </div>
  <div id="print-root" aria-hidden="true"></div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
